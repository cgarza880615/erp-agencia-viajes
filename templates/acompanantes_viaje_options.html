{% if acompanantes %}
<div style="display:flex; flex-wrap:wrap; gap:10px; padding:4px 0;">
  {% for a in acompanantes %}
  <label style="display:flex; align-items:center; gap:7px; cursor:pointer; padding:6px 12px;
                border:1px solid var(--border); border-radius:20px; background:var(--bg3);
                font-size:0.83rem; user-select:none;"
         title="{{ a.fecha_nacimiento or '' }}{% if a.parentesco %} · {{ a.parentesco }}{% endif %}">
    <input type="checkbox" name="acompanante_id" value="{{ a.id_acompanante }}"
           style="width:14px; height:14px; cursor:pointer;">
    {{ a.nombre }}
    {% if a.parentesco %}
    <span style="color:var(--text2); font-size:0.75rem;">({{ a.parentesco }})</span>
    {% endif %}
  </label>
  {% endfor %}
</div>
{% else %}
<p style="color:var(--text2); font-size:0.83rem; margin:0; padding:4px 0;">
  Este cliente no tiene viajeros frecuentes guardados todavía.
</p>
{% endif %}
