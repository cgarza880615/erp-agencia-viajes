<div id="semaforo-items" hx-swap-oob="true" style="display:flex; flex-wrap:wrap; gap:10px;">
  {% for item in semaforo %}
  {% if item.estado != 'na' %}
  <div style="display:flex; align-items:center; gap:7px; padding:7px 12px;
              border-radius:20px; font-size:0.82rem; font-weight:600;
              background:{% if item.estado == 'ok' %}rgba(39,174,96,0.1){% else %}rgba(229,62,62,0.1){% endif %};
              border:1px solid {% if item.estado == 'ok' %}rgba(39,174,96,0.3){% else %}rgba(229,62,62,0.3){% endif %};">
    <span>{% if item.estado == 'ok' %}🟢{% else %}🔴{% endif %}</span>
    <span style="color:{% if item.estado == 'ok' %}#166534{% else %}#991b1b{% endif %};">{{ item.label }}</span>
    <span style="font-size:0.72rem; opacity:0.7; font-weight:400;">
      ${{ '{:,.0f}'.format(item.pagado) }} / ${{ '{:,.0f}'.format(item.costo) }}
    </span>
  </div>
  {% else %}
  <div style="display:flex; align-items:center; gap:7px; padding:7px 12px;
              border-radius:20px; font-size:0.82rem;
              background:rgba(148,163,184,0.08); border:1px solid rgba(148,163,184,0.2);">
    <span>⚪</span>
    <span style="color:var(--text2);">{{ item.label }}</span>
    <span style="font-size:0.72rem; color:var(--text2);">N/A</span>
  </div>
  {% endif %}
  {% endfor %}
</div>
